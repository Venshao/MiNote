  <script>
    window.rich_editor_interface = {
      isNoteCreated: () => true,
      isFirstlyEnterNoteEdit: () => false,
      getDeviceFlag: () => 0,
      isDarkMode: () => false,
      onUndoRedoStateChanged: () => { },
      getLocaleInfo: () => '{"locale":"zh","countryCode":"CN","isRtl":false}',
      onStateChanged: () => { },
      getStringFromResource: () => "",
      getNumberAndStringFromResource: () => "",
      onPagePrepared: () => { },
      getStaticInfos: () => {
        return JSON.stringify({
          "edit_note_hint_title": "标题",
          "word_count": "0字",
          "image_annotation_edit_hint": "图片描述",
          "note_mindnote_entrance_hint_newversion": "开始书写或",
          "note_mindnote_entrance_icon_text_newversion": "创建思维笔记",
          "isNoteCreated": true,
          "isFirstlyEnterNoteEdit": false,
          "locale": "zh",
          "countryCode": "CN",
          "isRtl": false,
          "device_flag": 0,
          "info_timeString": "12月6日  傍晚6:34",
          "info_time": 1670322870955,
          "info_isHide": false
        })
      }
    }
    function hackRich() {
      // 对手机端进行些特殊优化，减少新建时候首屏时间
      if (!window.rich_editor_interface) return;
      if (!window.rich_editor_interface?.getStaticInfos) return;
      const staticInfos = JSON.parse(
        window.rich_editor_interface?.getStaticInfos() || "null",
      );
      if (
        staticInfos &&
        staticInfos.device_flag === 0 &&
        staticInfos.isNoteCreated
      ) {
        const _tempInterface = window.rich_editor_interface;
        window.rich_editor_interface = {
          getStaticInfos: _tempInterface.getStaticInfos,
          STATIC_INFOS: staticInfos,
          canCreateMindNote: (...args) => {
            return _tempInterface.canCreateMindNote(...args);
          },
          getBaseUri: (...args) => {
            return _tempInterface.getBaseUri(...args);
          },
          getContentLength: (...args) => {
            return _tempInterface.getContentLength(...args);
          },
          getDeviceFlag: (...args) => {
            return staticInfos.device_flag;
            const result = _tempInterface.getDeviceFlag(...args);
            return result;
          },
          getLocaleInfo: (...args) => {
            return JSON.stringify({
              locale: staticInfos.locale,
              countryCode: staticInfos.countryCode,
              isRtl: staticInfos.isRtl,
            });
            const result = _tempInterface.getLocaleInfo(...args);
            return result;
          },
          getNumberAndStringFromResource: (...args) => {
            if (args[0] === 0) {
              return staticInfos.word_count;
            }
            const result = _tempInterface.getNumberAndStringFromResource(...args);
            return result;
          },
          getStringFromResource: (...args) => {
            if (args[0] === "edit_note_hint_title") {
              return staticInfos.edit_note_hint_title;
            }
            if (args[0] === "image_annotation_edit_hint") {
              return staticInfos.image_annotation_edit_hint;
            }
            if (args[0] === "note_mindnote_entrance_hint_newversion") {
              return staticInfos.note_mindnote_entrance_hint_newversion;
            }
            if (args[0] === "note_mindnote_entrance_icon_text_newversion") {
              return staticInfos.note_mindnote_entrance_icon_text_newversion;
            }
            const result = _tempInterface.getStringFromResource(...args);
            return result;
          },
          isDarkMode: (...args) => {
            return _tempInterface.isDarkMode(...args);
          },
          isFirstlyEnterNoteEdit: (...args) => {
            return staticInfos.isFirstlyEnterNoteEdit;
            const result = _tempInterface.isFirstlyEnterNoteEdit(...args);
            return result;
          },
          isNoteCreated: (...args) => {
            return staticInfos.isNoteCreated;
            const result = _tempInterface.isNoteCreated(...args);
            return result;
          },
          onChangeToMindMap: (...args) => {
            return _tempInterface.onChangeToMindMap(...args);
          },
          onContentOverLength: (...args) => {
            return _tempInterface?.onContentOverLength(...args);
          },
          onDisableScroll: (...args) => {
            return _tempInterface.onDisableScroll(...args);
          },
          onEmbedElementClicked: (...args) => {
            return _tempInterface.onEmbedElementClicked(...args);
          },
          onImageAnnotationOverLength: (...args) => {
            return _tempInterface.onImageAnnotationOverLength(...args);
          },
          onPagePrepared: (...args) => {
            return _tempInterface.onPagePrepared(...args);
          },
          onPopMenuHide: (...args) => {
            return _tempInterface.onPopMenuHide(...args);
          },
          onRichTextPanelStateChanged: (...args) => {
            return _tempInterface.onRichTextPanelStateChanged(...args);
          },
          onSaveData: (...args) => {
            return _tempInterface.onSaveData(...args);
          },
          onShareImage: (...args) => {
            return _tempInterface.onShareImage(...args);
          },
          onShowMindNoteGuide: (...args) => {
            return _tempInterface.onShowMindNoteGuide(...args);
          },
          onStartDragElement: (...args) => {
            return _tempInterface.onStartDragElement(...args);
          },
          onStateChanged: (...args) => {
            const result = _tempInterface.onStateChanged(...args);
            return result;
          },
          onTextCountChanged: (...args) => {
            const result = _tempInterface.onTextCountChanged(...args);
            return result;
          },
          onTextStyleChanged: (...args) => {
            const result = _tempInterface.onTextStyleChanged(...args);
            return result;
          },
          onTitleChanged: (...args) => {
            return _tempInterface.onTitleChanged(...args);
          },
          onUndoRedoStateChanged: (...args) => {
            return _tempInterface.onUndoRedoStateChanged(...args);
          },
          performHaptic: (...args) => {
            return _tempInterface.performHaptic(...args);
          },
          trackEvent: (...args) => {
            return _tempInterface.trackEvent(...args);
          },
        };
      }
    };
    hackRich();
  </script>
